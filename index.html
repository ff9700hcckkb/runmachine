<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跑步機紀錄</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --paper:#E7E4DA;
    --card:#F4F2EA;
    --ink:#20261F;
    --ink-soft:#63614F;
    --line:#C7C2AE;
    --teal:#1F6F5C;
    --teal-deep:#123F35;
    --coral:#C1502B;
    --coral-soft:#F0D9CC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;}
  .wrap{max-width:920px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}

  header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.75rem;flex-wrap:wrap;}
  h1{font-size:2rem;font-weight:600;margin:0;letter-spacing:-0.01em;}
  header .sub{font-size:0.85rem;color:var(--ink-soft);margin-top:0.35rem;font-family:'JetBrains Mono',monospace;}
  #last-updated{font-size:0.78rem;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:2rem;}
  .stat{background:var(--card);padding:1rem 1.1rem;}
  .stat .label{font-size:0.78rem;color:var(--ink-soft);margin-bottom:0.4rem;}
  .stat .val{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:600;color:var(--teal-deep);}
  .stat .val small{font-size:0.9rem;font-weight:400;color:var(--ink-soft);margin-left:2px;}

  .panel{background:var(--card);border:1px solid var(--line);padding:1.5rem;margin-bottom:1.75rem;}
  .panel h2{font-size:1.05rem;margin:0 0 1rem;font-weight:600;}

  .controls{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center;}
  .controls input, .controls select{
    font-family:'JetBrains Mono',monospace;
    font-size:0.85rem;
    padding:0.5rem 0.7rem;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    border-radius:2px;
  }
  .controls input[type=text]{flex:1;min-width:140px;}
  .controls label{font-size:0.78rem;color:var(--ink-soft);margin-right:-0.4rem;}


  table{width:100%;border-collapse:collapse;font-size:0.88rem;}
  thead th{
    text-align:left;
    font-weight:600;
    font-size:0.76rem;
    color:var(--ink-soft);
    padding:0 0.6rem 0.6rem;
    border-bottom:1px solid var(--ink);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--teal-deep);}
  thead th.active{color:var(--teal-deep);}
  thead th[data-key="incline"], thead th[data-key="speedRaw"], thead th[data-key="min"]{text-align:center;}
  tbody.session-group{border-top:1px solid var(--ink);}
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:hover{background:rgba(31,111,92,0.06);}
  tbody td{padding:0.65rem 0.6rem;vertical-align:top;}
  td.num{font-family:'JetBrains Mono',monospace;text-align:center;white-space:nowrap;}
  td.date{font-family:'JetBrains Mono',monospace;white-space:nowrap;vertical-align:middle;}
  .session-total{font-size:0.72rem;color:var(--ink-soft);margin-top:0.2rem;}
  td.note{color:var(--ink-soft);font-size:0.83rem;}
  td.bpm{font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--ink-soft);white-space:nowrap;vertical-align:middle;}

  .pager{display:flex;justify-content:space-between;align-items:center;margin-top:1.1rem;font-size:0.82rem;color:var(--ink-soft);}
  .pager button{
    font-family:'JetBrains Mono',monospace;
    border:1px solid var(--line);
    background:#fff;
    padding:0.4rem 0.8rem;
    cursor:pointer;
    border-radius:2px;
  }
  .pager button:disabled{opacity:0.35;cursor:default;}
  .pager .btns{display:flex;gap:0.5rem;}

  .empty, .loading{padding:2rem 0;text-align:center;color:var(--ink-soft);font-size:0.9rem;}
  .error{padding:1rem;background:var(--coral-soft);color:#5c2412;border-radius:2px;font-size:0.85rem;}

  @media (max-width:640px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    thead th[data-key="note"], td.note{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>跑步機紀錄</h1>
      <div class="sub">坡度 · 速度 · 心率 —— 訓練日誌</div>
    </div>
    <div id="last-updated"></div>
  </header>

  <div class="stat-row" id="stat-row">
    <div class="stat"><div class="label">總次數</div><div class="val" id="stat-count">–</div></div>
    <div class="stat"><div class="label">累計時數</div><div class="val" id="stat-minutes">–</div></div>
    <div class="stat"><div class="label">平均心率</div><div class="val" id="stat-bpm">–</div></div>
    <div class="stat"><div class="label">本月時數</div><div class="val" id="stat-month">–</div></div>
  </div>

  <div class="panel">
    <h2>訓練明細</h2>
    <div class="controls">
      <label>範圍</label>
      <select id="range-filter">
        <option value="all">全部</option>
        <option value="30">近 30 天</option>
        <option value="90">近 90 天</option>
        <option value="ytd">今年</option>
      </select>
      <input type="text" id="search-box" placeholder="搜尋備註…">
    </div>
    <div id="table-holder"><div class="loading">載入中…</div></div>
    <div class="pager" id="pager" style="display:none;">
      <span id="page-info"></span>
      <div class="btns">
        <button id="prev-btn">← 上一頁</button>
        <button id="next-btn">下一頁 →</button>
      </div>
    </div>
  </div>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5sMVCR4COJbacXIfqilQmuf8fWvUTYKT_XDXZ_KJskN_PZTPpopyvBXuwPLGvZ3z0pLdEO7WhYC26/pub?output=csv";
const PAGE_SIZE = 10;

let ALL_ROWS = [];
let SORT_KEY = "date";
let SORT_DIR = -1;
let PAGE = 0;

function parseSpeed(s){
  if(!s) return null;
  const nums = String(s).split("~").map(x=>parseFloat(x)).filter(n=>!isNaN(n));
  if(!nums.length) return null;
  return nums.reduce((a,b)=>a+b,0)/nums.length;
}
function parseBpm(s){
  if(!s) return {avg:null, max:null, raw:""};
  const raw = String(s).trim();
  const avgM = raw.match(/avg\.?\s*(\d+)/i);
  const maxM = raw.match(/max\.?\s*(\d+)/i);
  return {
    avg: avgM ? parseInt(avgM[1]) : null,
    max: maxM ? parseInt(maxM[1]) : null,
    raw: raw.replace(/\n/g," / ")
  };
}

function loadData(){
  Papa.parse(CSV_URL, {
    download:true,
    header:true,
    skipEmptyLines:true,
    complete: function(results){
      try{
        // Merged cells in Google Sheets only keep their value in the first
        // (top-left) row when published as CSV — every other row in the
        // merged range comes through blank. Forward-fill date and bpm from
        // the previous row so a merged 3-row session doesn't lose 2 of its
        // rows (or its heart-rate reading).
        let lastDate = null, lastBpm = null;
        const filled = results.data.map(r => {
          let date = (r.date||"").trim();
          let bpm = (r.bpm||"").trim();
          if(date) lastDate = date; else date = lastDate;
          if(bpm) lastBpm = bpm; else bpm = lastBpm;
          return Object.assign({}, r, {date, bpm});
        }).filter(r => r.date);

        ALL_ROWS = filled.map(r => {
            const bpm = parseBpm(r.bpm);
            return {
              date: r.date.trim(),
              incline: parseFloat(r.incline) || null,
              speedRaw: (r.speed||"").trim(),
              speedAvg: parseSpeed(r.speed),
              min: parseFloat(r.min) || 0,
              note: (r.note||"").trim(),
              bpmAvg: bpm.avg,
              bpmMax: bpm.max,
              bpmRaw: bpm.raw
            };
          });
        document.getElementById("last-updated").textContent = "更新於 " + new Date().toLocaleString("zh-TW",{hour12:false});
        renderStats();
        renderTable();
      }catch(e){
        showError("資料格式解析失敗: " + e.message);
      }
    },
    error: function(err){
      showError("無法讀取試算表，請確認已發佈為網路 CSV：" + err);
    }
  });
}

function showError(msg){
  document.getElementById("table-holder").innerHTML = '<div class="error">'+msg+'</div>';
}

function groupSessions(rows){
  const order = [];
  const map = new Map();
  rows.forEach(r=>{
    if(!map.has(r.date)){
      map.set(r.date, {date:r.date, totalMin:0, bpmAvg:r.bpmAvg, bpmMax:r.bpmMax, bpmRaw:r.bpmRaw, segments:[]});
      order.push(r.date);
    }
    const g = map.get(r.date);
    g.totalMin += r.min;
    g.segments.push(r);
  });
  return order.map(d=>map.get(d));
}

function renderStats(){
  const sessions = groupSessions(ALL_ROWS);
  const count = sessions.length;
  const totalMin = ALL_ROWS.reduce((s,r)=>s+r.min,0);
  const bpms = sessions.map(s=>s.bpmAvg).filter(v=>v!=null);
  const avgBpm = bpms.length ? Math.round(bpms.reduce((a,b)=>a+b,0)/bpms.length) : null;

  const now = new Date();
  const thisMonth = ALL_ROWS.filter(r=>{
    const d = new Date(r.date.replace(/\//g,"-"));
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
  const monthMin = thisMonth.reduce((s,r)=>s+r.min,0);

  document.getElementById("stat-count").innerHTML = count + '<small>次</small>';
  document.getElementById("stat-minutes").innerHTML = totalMin + '<small>分</small>';
  document.getElementById("stat-bpm").innerHTML = (avgBpm!=null ? avgBpm : "–") + '<small>bpm</small>';
  document.getElementById("stat-month").innerHTML = monthMin + '<small>分</small>';
}

function filteredSessions(){
  let rows = [...ALL_ROWS];
  const range = document.getElementById("range-filter").value;
  const q = document.getElementById("search-box").value.trim().toLowerCase();

  if(range !== "all"){
    const now = new Date();
    rows = rows.filter(r=>{
      const d = new Date(r.date.replace(/\//g,"-"));
      if(range==="ytd") return d.getFullYear()===now.getFullYear();
      const days = parseInt(range);
      return (now - d)/(1000*60*60*24) <= days;
    });
  }

  let sessions = groupSessions(rows);

  if(q){
    sessions = sessions.filter(s => s.segments.some(seg => (seg.note||"").toLowerCase().includes(q)));
  }

  sessions.sort((a,b)=>{
    let av, bv;
    if(SORT_KEY==="date" || SORT_KEY==="bpmRaw" || !["incline","speedRaw","min","note"].includes(SORT_KEY)){
      av = new Date(a.date.replace(/\//g,"-"));
      bv = new Date(b.date.replace(/\//g,"-"));
    } else {
      av = a.segments[0] ? a.segments[0][SORT_KEY] : null;
      bv = b.segments[0] ? b.segments[0][SORT_KEY] : null;
    }
    if(av==null) av = -Infinity;
    if(bv==null) bv = -Infinity;
    if(av<bv) return -1*SORT_DIR;
    if(av>bv) return 1*SORT_DIR;
    return 0;
  });
  return sessions;
}

function renderTable(){
  const holder = document.getElementById("table-holder");
  const sessions = filteredSessions();

  if(!sessions.length){
    holder.innerHTML = '<div class="empty">沒有符合條件的紀錄</div>';
    document.getElementById("pager").style.display = "none";
    return;
  }

  const totalPages = Math.ceil(sessions.length / PAGE_SIZE);
  PAGE = Math.min(PAGE, totalPages-1);
  const pageSessions = sessions.slice(PAGE*PAGE_SIZE, PAGE*PAGE_SIZE+PAGE_SIZE);

  const cols = [
    {key:"date", label:"日期"},
    {key:"incline", label:"坡度"},
    {key:"speedRaw", label:"速度"},
    {key:"min", label:"時間"},
    {key:"note", label:"備註"},
    {key:"bpmRaw", label:"心率"},
  ];

  let thead = "<tr>" + cols.map(c=>
    `<th data-key="${c.key}" class="${c.key===SORT_KEY?'active':''}">${c.label}${c.key===SORT_KEY ? (SORT_DIR===1?' ↑':' ↓') : ''}</th>`
  ).join("") + "</tr>";

  let tbody = pageSessions.map(s=>{
    const n = s.segments.length;
    const rowsHtml = s.segments.map((seg, i)=>{
      if(i===0){
        return `<tr class="session-first">
          <td class="date" rowspan="${n}">${s.date}<div class="session-total">共 ${s.totalMin}′</div></td>
          <td class="num">${seg.incline!=null ? seg.incline+'%' : '–'}</td>
          <td class="num">${seg.speedRaw || '–'}</td>
          <td class="num">${seg.min}′</td>
          <td class="note">${seg.note || ''}</td>
          <td class="bpm" rowspan="${n}">${s.bpmRaw || '–'}</td>
        </tr>`;
      }
      return `<tr>
          <td class="num">${seg.incline!=null ? seg.incline+'%' : '–'}</td>
          <td class="num">${seg.speedRaw || '–'}</td>
          <td class="num">${seg.min}′</td>
          <td class="note">${seg.note || ''}</td>
        </tr>`;
    }).join("");
    return `<tbody class="session-group">${rowsHtml}</tbody>`;
  }).join("");

  holder.innerHTML = `<table><thead>${thead}</thead>${tbody}</table>`;

  holder.querySelectorAll("thead th").forEach(th=>{
    th.addEventListener("click", ()=>{
      const key = th.dataset.key;
      if(SORT_KEY===key) SORT_DIR *= -1; else { SORT_KEY = key; SORT_DIR = -1; }
      PAGE = 0;
      renderTable();
    });
  });

  const pager = document.getElementById("pager");
  pager.style.display = "flex";
  document.getElementById("page-info").textContent = `第 ${PAGE+1} / ${totalPages} 頁 · 共 ${sessions.length} 天`;
  document.getElementById("prev-btn").disabled = PAGE===0;
  document.getElementById("next-btn").disabled = PAGE>=totalPages-1;
}

document.getElementById("prev-btn").addEventListener("click", ()=>{ PAGE--; renderTable(); });
document.getElementById("next-btn").addEventListener("click", ()=>{ PAGE++; renderTable(); });
document.getElementById("range-filter").addEventListener("change", ()=>{ PAGE=0; renderTable(); });
document.getElementById("search-box").addEventListener("input", ()=>{ PAGE=0; renderTable(); });

loadData();
setInterval(loadData, 5*60*1000);
</script>
</body>
</html>
